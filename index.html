<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群晖面板记录修复</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f6fa;color:#182638;margin:40px auto;max-width:1100px;padding:0 20px}h1{font-size:28px}p{line-height:1.7}.tag{background:#d9f3e6;padding:5px 12px;border-radius:20px}table{width:100%;background:white;border-collapse:collapse;margin-top:24px}td,th{text-align:left;padding:14px;border-bottom:1px solid #e5e9ef;overflow-wrap:anywhere}.note{background:#fff5da;padding:18px;border-radius:10px}button{padding:9px 18px;border:1px solid #becbd9;border-radius:8px;background:white;cursor:pointer}button:disabled{opacity:.45;cursor:wait}#summary{font-size:20px}small{color:#536577}.scroll{overflow-x:auto}</style>
<header><span class="tag">Container Cache Guard · 按需检查</span><h1>群晖面板记录修复</h1><p>服务能打开，面板却提示“容器不存在”？先检查真实容器和面板记录，再选择要修复的一项。</p></header>
<p class="note">开始前，请等映像更新、项目构建全部结束。扫描约需 60 秒；修复只适用于已识别的旧名称记录，会先备份。不会启动、停止或重建业务容器。无法保证修复所有面板故障。</p>
<p><button id="scan">开始扫描</button></p><p id="summary">正在连接…</p><small id="meta"></small><p id="error" role="alert"></p><div id="pending"></div>
<div class="scroll"><table><thead><tr><th>真实容器</th><th>面板记录</th><th>状态</th><th>检查结果</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
let csrf='', timer=null, busy=false;
const el=id=>document.getElementById(id), labels={matched:'一致，无需修复',observing:'尚未满足稳定条件',persistent_mismatch:'持续错名',manual_review:'需人工检查'};
async function action(path,body){if(busy)return;busy=true;el('scan').disabled=true;el('error').textContent='';try{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');}catch(e){el('error').textContent=e.message;}finally{busy=false;await refresh();}}
async function refresh(){clearTimeout(timer);try{const r=await fetch('/api/status');if(!r.ok)throw Error('连接失败，请重新登录');const d=await r.json();csrf=d.csrf;el('scan').disabled=busy||d.phase==='scanning';el('summary').textContent=d.error||d.message||(d.phase==='scanning'?`扫描中：${d.sample||0}/3 次检查，请等待…`:d.phase==='ready'?`已检查 ${(d.rows||[]).length} 份记录`:'等待手动扫描');el('meta').textContent=d.version?'Container Manager '+d.version+(d.supported?'':' · 此版本不开放修复')+(d.errors?.length?' · 存在不可读取记录，本轮不开放修复':''):'';el('rows').replaceChildren();for(const row of d.rows||[]){const tr=document.createElement('tr');for(const value of [row.actual||'未匹配',row.cached||row.file,row.state||'未知',labels[row.result]||row.result]){const td=document.createElement('td');td.textContent=value;tr.append(td);}const td=document.createElement('td');if(row.plan){const b=document.createElement('button');b.textContent='备份并修复';b.onclick=()=>{if(confirm('将面板记录 '+row.cached+' 修正为 '+row.actual+'。先备份，不重启容器。请确认没有更新或构建正在进行。'))action('repair',{plan:row.plan});};td.append(b);}tr.append(td);el('rows').append(tr);}el('pending').replaceChildren();for(const tx of d.pending||[]){const p=document.createElement('p');p.textContent='未完成记录：'+tx+' ';const b=document.createElement('button');b.textContent='检查并恢复';b.onclick=()=>{if(confirm('核对未完成操作；只清理本工具未被修改的副本，或确认已完成的修复。外部变更将拒绝处理。'))action('recover',{transaction:tx});};p.append(b);el('pending').append(p);}if(d.phase==='scanning')timer=setTimeout(refresh,2000);}catch(e){el('error').textContent=e.message;el('scan').disabled=true;}}
el('scan').onclick=()=>action('scan',{});refresh();
</script></html>
